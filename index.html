<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remora Production Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      color: #1a1a1a;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a3a5c;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: #c8820a;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      gap: 32px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
      background: #1a3a5c;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #c8820a;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">R</div>
    <h1>Remora Production Explorer</h1>
  </header>
  <main>
    <div class="buttons">
      <a href="https://magnet-prod-explorer.netlify.app/" class="btn">Magnet Withers</a>
      <a href="https://keeran-prod-explorer.netlify.app/" class="btn">Keeran Ranch</a>
      <a href="https://markham-prod-explorer.netlify.app/" class="btn">Markham-NBC</a>
    </div>
  </main>
</body>
</html>
